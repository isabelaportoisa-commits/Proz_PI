<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ações práticas | O que Você pode fazer</title>
    <link rel="icon" type="industry" href="assets/img/industry.png">
    <link rel="stylesheet" href="assets/css/style.css">   
    <script src="assets/js/script.js" defer></script> 
</head>
<body>
    <header>
        <nav class="menu-navegacao">
            <a href="index.html"><img class="icone" src="assets/img/cartaz.png" alt="icone cartaz"> Cartaz</a>
            <a href="sobre.html"><img src="assets/img/sob.png" alt="icone sobre"> Sobre</a>
            <a href="acoes.html" class="ativo"><img src="assets/img/acs.png" alt="icone ações"> Ações</a>
        </nav>
        <div class="foto"><img src="assets/img/acao.png" alt="imagem ações" width="150" height="150" ></div>
        <h1> Ações Práticas</h1>
        <h4>O que você pode fazer para economizar água.</h4>

    </header>
    <main>
        <section >
            <h2>Ações que fazem a diferença</h2>
            <div class="lista-acoes" id="container-acoes">

            </div>
        </section>

        <section class="secao-dois">
            <div class="container-central" >
                <h2>Quero fazer parte !</h2>
                <p class="minip">Faça a diferença, contate-nos !</p>

                <form class="formulario" id="formulario-adesao" action="" novalidate>
                    <h3>VisionTech Action</h3>

                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" name="nome" required placeholder="Ex: Maria da Silva">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="Ex:Maria@email.com">
                    <label for="telefone">Telefone</label>
                    <input type="tel" id="telefone" name="telefone" required placeholder="(XX) XXXXX-XXXX">
                    <button class="botao" type="submit">Registrar a minha adesão</button>

                    <p class="mensagem-retorno" id="mensagem-retorno"></p>

                </form>

            </div>
        </section>
        <div style="text-align:center; background-color:#dbe8f0 ;"><a href="#voltar" class="botao">Voltar ao ínicio</a></div>

    <footer>
        <p><strong>Equipe:</strong> VisionTech</p>
        <p>&copy; Projeto integrador - Liga Steam - 2026 - Isabela Porto</p>
    </footer>
